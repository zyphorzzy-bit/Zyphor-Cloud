<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zyphor Cloud — Entrar</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <!-- LOGO -->

            <a href="../index.html" class="auth-logo">
                ZYPHOR <span>CLOUD</span>
            </a>


            <!-- CABEÇALHO -->

            <div class="auth-header">

                <span class="auth-badge">
                    ZYPHOR CLOUD
                </span>

                <h1 data-i18n="auth.loginTitle">
                    Entrar
                </h1>

                <p data-i18n="auth.loginDescription">
                    Entre na sua conta para acessar seus projetos.
                </p>

            </div>


            <!-- IDIOMA -->

            <div class="language-selector auth-language">

                <button
                    class="language-btn"
                    type="button"
                    aria-label="Selecionar idioma"
                >
                    🇧🇷 Português
                </button>

                <div class="language-menu">

                    <button
                        type="button"
                        data-lang="pt-BR"
                    >
                        🇧🇷 Português
                    </button>

                    <button
                        type="button"
                        data-lang="en-US"
                    >
                        🇺🇸 English
                    </button>

                    <button
                        type="button"
                        data-lang="es"
                    >
                        🇪🇸 Español
                    </button>

                </div>

            </div>


            <!-- FORMULÁRIO -->

            <form class="auth-form">

                <div class="form-group">

                    <label
                        for="email"
                        data-i18n="auth.email"
                    >
                        E-mail
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        placeholder="Digite seu e-mail"
                        data-i18n-placeholder="auth.emailPlaceholder"
                        required
                    >

                </div>


                <div class="form-group">

                    <label
                        for="password"
                        data-i18n="auth.password"
                    >
                        Senha
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Digite sua senha"
                        data-i18n-placeholder="auth.loginPasswordPlaceholder"
                        required
                    >

                </div>


                <div class="auth-options">

                    <label class="auth-check">

                        <input
                            type="checkbox"
                            id="remember"
                            name="remember"
                        >

                        <span data-i18n="auth.remember">
                            Lembrar de mim
                        </span>

                    </label>

                    <a
                        href="#"
                        data-i18n="auth.forgotPassword"
                    >
                        Esqueci minha senha
                    </a>

                </div>


                <button
                    type="submit"
                    class="auth-button"
                    data-i18n="auth.loginButton"
                >
                    Entrar
                </button>

            </form>


            <!-- CRIAR CONTA -->

            <div class="auth-divider">

                <span data-i18n="auth.noAccount">
                    Ainda não possui uma conta?
                </span>

            </div>


            <a
                href="cadastro.html"
                class="auth-secondary-button"
                data-i18n="nav.signup"
            >
                Criar conta
            </a>


            <!-- VOLTAR -->

            <a
                href="../index.html"
                class="auth-back"
                data-i18n="auth.backHome"
            >
                ← Voltar para o início
            </a>

        </div>

    </main>


    <!-- SCRIPTS -->

    <script src="../js/i18n.js"></script>
    <script src="../js/auth.js"></script>

</body>

</html>
