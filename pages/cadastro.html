<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zyphor Cloud — Criar conta</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <a href="../index.html" class="auth-logo">
                ZYPHOR <span>CLOUD</span>
            </a>

            <div class="auth-header">

                <span class="auth-badge">
                    ZYPHOR CLOUD
                </span>

                <h1 data-i18n="auth.registerTitle">
                    Criar conta
                </h1>

                <p data-i18n="auth.registerDescription">
                    Crie sua conta para começar a usar a Zyphor Cloud.
                </p>

            </div>


            <!-- IDIOMA -->

            <div class="language-selector auth-language">

                <button
                    class="language-btn"
                    type="button"
                    aria-label="Selecionar idioma"
                >
                    🇧🇷 Português
                </button>

                <div class="language-menu">

                    <button type="button" data-lang="pt-BR">
                        🇧🇷 Português
                    </button>

                    <button type="button" data-lang="en-US">
                        🇺🇸 English
                    </button>

                    <button type="button" data-lang="es">
                        🇪🇸 Español
                    </button>

                </div>

            </div>


            <!-- FORMULÁRIO -->

            <form class="auth-form">

                <div class="form-group">

                    <label
                        for="name"
                        data-i18n="auth.name"
                    >
                        Nome
                    </label>

                    <input
                        id="name"
                        name="name"
                        type="text"
                        autocomplete="name"
                        placeholder="Digite seu nome"
                        data-i18n-placeholder="auth.namePlaceholder"
                    >

                </div>


                <div class="form-group">

                    <label
                        for="email"
                        data-i18n="auth.email"
                    >
                        E-mail
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        placeholder="Digite seu e-mail"
                        data-i18n-placeholder="auth.emailPlaceholder"
                    >

                </div>


                <div class="form-group">

                    <label
                        for="password"
                        data-i18n="auth.password"
                    >
                        Senha
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Crie uma senha"
                        data-i18n-placeholder="auth.passwordPlaceholder"
                    >

                </div>


                <div class="form-group">

                    <label
                        for="confirm-password"
                        data-i18n="auth.confirmPassword"
                    >
                        Confirmar senha
                    </label>

                    <input
                        id="confirm-password"
                        name="confirm-password"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Digite a senha novamente"
                        data-i18n-placeholder="auth.confirmPasswordPlaceholder"
                    >

                </div>


                <label class="auth-check">

                    <input
                        type="checkbox"
                        id="terms"
                    >

                    <span>
                        <span data-i18n="auth.accept">
                            Eu aceito os
                        </span>

                        <a
                            href="termos.html"
                            data-i18n="footer.terms"
                        >
                            Termos
                        </a>

                        <span data-i18n="auth.and">
                            e a
                        </span>

                        <a
                            href="privacidade.html"
                            data-i18n="footer.privacy"
                        >
                            Política de Privacidade
                        </a>.
                    </span>

                </label>


                <button
                    type="submit"
                    class="auth-button"
                    data-i18n="auth.createAccount"
                >
                    Criar conta
                </button>

            </form>


            <div class="auth-divider">
                <span data-i18n="auth.alreadyAccount">
                    Já possui uma conta?
                </span>
            </div>


            <a
                href="login.html"
                class="auth-secondary-button"
                data-i18n="nav.login"
            >
                Entrar
            </a>


            <a
                href="../index.html"
                class="auth-back"
                data-i18n="auth.backHome"
            >
                ← Voltar para o início
            </a>

        </div>

    </main>


    <script src="../js/i18n.js"></script>
    <script src="../js/auth.js"></script>

</body>
</html>
